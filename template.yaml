AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Amazon Quick SSO with Keycloak

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Infrastructure
        Parameters:
          - VpcId
          - PublicSubnet1
          - PublicSubnet2
          - InstanceType
          - AmiId
          - KeyPairName
      - Label:
          default: Keycloak
        Parameters:
          - KeycloakDomain
          - KeycloakAdminUsername
      - Label:
          default: PostgreSQL
        Parameters:
          - PostgresUser

Parameters:
  # Infrastructure
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 1 (ALB + EC2)

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 2 (ALB requires 2 AZs)

  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues:
      - t4g.medium
    Description: EC2 instance type

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-09317ccfac89b432d
    Description: >-
      AL2023 arm64 AMI (us-east-1). Pinned to a specific, known-good AMI ID
      instead of resolving the SSM al2023-ami-kernel-default-arm64 dynamic
      reference directly in the EC2Instance's ImageId property (do not
      write that reference's literal double-brace syntax anywhere in this
      template, including in free-text Description fields like this one --
      CloudFormation parses dynamic-reference syntax wherever it appears,
      not just in resource properties, and this exact mistake -- pasting
      the reference into this field's own description as an example --
      has broken a deploy before). That inline dynamic
      reference is re-resolved on every stack update, so any unrelated
      template change (e.g. a Lambda code tweak) picks up whatever AMI AWS
      published most recently and silently replaces this running instance —
      which is running Keycloak + Postgres, so a replacement means data
      loss. Putting the pin behind a Parameter Default (this field) plus
      `UpdateReplacePolicy: Retain` on EC2Instance fixes that: CloudFormation
      only re-resolves this value when you explicitly pass a new one.
      Deploying in a region other than us-east-1, or want a newer AMI?
      Override this parameter explicitly (and treat it as a deliberate,
      reviewed instance replacement, not an accidental side effect).

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair name retained for break-glass access; no SSH ingress is opened by this template

  # Keycloak
  KeycloakDomain:
    Type: String
    Default: sso.example.com
    Description: Keycloak domain name

  KeycloakAdminUsername:
    Type: String
    Default: admin
    Description: Keycloak bootstrap admin username

  # PostgreSQL
  PostgresUser:
    Type: String
    Default: keycloak
    Description: PostgreSQL username

Resources:

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group - HTTPS from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    Properties:
      GroupDescription: EC2 Security Group - inbound from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Keycloak HTTP from ALB only

  # ACM Certificate
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref KeycloakDomain
      ValidationMethod: DNS

  # ALB
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !Ref EC2Instance

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  KeycloakAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "Initial Keycloak master admin password for ${AWS::StackName}"
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"''\/@$`'

  PostgresSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "PostgreSQL password for Keycloak in ${AWS::StackName}"
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"''\/@$`'

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadBootstrapSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref KeycloakAdminSecret
                  - !Ref PostgresSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DisableApiTermination: true
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          umask 077

          # Install Docker
          dnf update -y
          dnf install -y docker git
          systemctl enable docker
          systemctl start docker

          # Install Docker Compose plugin
          DOCKER_COMPOSE_VERSION=v2.29.7
          DOCKER_COMPOSE_SHA256=6e9fbd5daa20dca5d7d89145081ae8155d68ef2928b497d9f85b54fe0f9dbb2c
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/$DOCKER_COMPOSE_VERSION/docker-compose-linux-aarch64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          echo "$DOCKER_COMPOSE_SHA256  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # Clone repository
          git clone --branch v2026.09.14-security --depth 1 https://github.com/toreydai/quick-keycloak-sso.git /opt/keycloak
          cd /opt/keycloak/docker

          KEYCLOAK_ADMIN_PASSWORD=$(aws secretsmanager get-secret-value \
            --region ${AWS::Region} --secret-id ${KeycloakAdminSecret} \
            --query SecretString --output text \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['password'])")
          POSTGRES_PASSWORD=$(aws secretsmanager get-secret-value \
            --region ${AWS::Region} --secret-id ${PostgresSecret} \
            --query SecretString --output text \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['password'])")

          # Create .env from generated secrets.
          cat > .env << EOF
          POSTGRES_USER=${PostgresUser}
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=keycloak

          KC_BOOTSTRAP_ADMIN_USERNAME=${KeycloakAdminUsername}
          KC_BOOTSTRAP_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD
          KC_DB_URL_HOST=host.docker.internal
          KC_HOSTNAME=${KeycloakDomain}
          EOF
          chmod 600 .env

          # Start services
          docker compose -f compose.postgres.yaml up -d
          docker compose -f compose.keycloak.yaml up -d

          # Create bootstrap .env
          cd /opt/keycloak/bootstrap
          cat > .env << EOF
          # Keycloak 连接
          KEYCLOAK_SERVER_URL=http://localhost:8080
          KEYCLOAK_MASTER_ADMIN_USERNAME=
          KEYCLOAK_MASTER_ADMIN_PASSWORD=

          # Realm（默认 quick）
          KEYCLOAK_QUICK_REALM=quick

          # Quick 管理员用户
          KEYCLOAK_QUICK_ADMIN_USERNAME=
          KEYCLOAK_QUICK_ADMIN_PASSWORD=
          KEYCLOAK_QUICK_ADMIN_EMAIL=

          # Amazon Quick 账户名称
          QUICK_ACCOUNT_NAME=

          # AWS 账户
          AWS_ACCOUNT_ID=${AWS::AccountId}

          # SAML Mapper 配置
          MAPPER_SESSION_DURATION_VALUE=43200
          EOF
          chmod 600 .env

  # IAM Roles - Pro
  QuickAdminProRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickAdminProRole
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/keycloak
            Action:
              - sts:AssumeRoleWithSAML
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Policies:
        - PolicyName: QuickFederatedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: quicksight:CreateAdmin
                Resource: !Sub arn:aws:quicksight::${AWS::AccountId}:user/${!aws:userid}

  QuickAuthorProRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickAuthorProRole
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/keycloak
            Action:
              - sts:AssumeRoleWithSAML
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Policies:
        - PolicyName: QuickFederatedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: quicksight:CreateUser
                Resource: !Sub arn:aws:quicksight::${AWS::AccountId}:user/${!aws:userid}

  QuickReaderProRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickReaderProRole
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/keycloak
            Action:
              - sts:AssumeRoleWithSAML
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Policies:
        - PolicyName: QuickFederatedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: quicksight:CreateReader
                Resource: !Sub arn:aws:quicksight::${AWS::AccountId}:user/${!aws:userid}

  # IAM Roles - Standard
  QuickAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickAdminRole
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/keycloak
            Action:
              - sts:AssumeRoleWithSAML
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Policies:
        - PolicyName: QuickFederatedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: quicksight:CreateAdmin
                Resource: !Sub arn:aws:quicksight::${AWS::AccountId}:user/${!aws:userid}

  QuickAuthorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickAuthorRole
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/keycloak
            Action:
              - sts:AssumeRoleWithSAML
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Policies:
        - PolicyName: QuickFederatedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: quicksight:CreateUser
                Resource: !Sub arn:aws:quicksight::${AWS::AccountId}:user/${!aws:userid}

  QuickReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickReaderRole
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/keycloak
            Action:
              - sts:AssumeRoleWithSAML
              - sts:TagSession
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      Policies:
        - PolicyName: QuickFederatedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: quicksight:CreateReader
                Resource: !Sub arn:aws:quicksight::${AWS::AccountId}:user/${!aws:userid}

  # Lambda - Subscription Assign
  QuickSubscriptionAssignLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: QuickUpdateUser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - quicksight:UpdateUser
                  - quicksight:DescribeUser
                Resource: !Sub arn:aws:quicksight:*:${AWS::AccountId}:user/default/*

  QuickSubscriptionAssignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Handler: index.handler
      Architectures:
        - arm64
      Timeout: 30
      Role: !GetAtt QuickSubscriptionAssignLambdaRole.Arn
      InlineCode: |
        import boto3

        quick = boto3.client("quicksight")

        # All six Quick roles created by bootstrap/main.py, not just the
        # three Pro tiers. Before this fix, a user provisioned into the
        # standard (non-Pro) admin/author/reader groups would never get
        # their QuickSight subscription auto-assigned on first login —
        # `role_part not in ROLE_SUBSCRIPTION_MAP` silently returns, so the
        # Lambda does nothing and the user is stuck without a subscription
        # until someone notices and fixes it by hand.
        ROLE_SUBSCRIPTION_MAP = {
            "QuickAdminProRole": "ADMIN_PRO",
            "QuickAuthorProRole": "AUTHOR_PRO",
            "QuickReaderProRole": "READER_PRO",
            "QuickAdminRole": "ADMIN",
            "QuickAuthorRole": "AUTHOR",
            "QuickReaderRole": "READER",
        }


        def handler(event, context):
            detail = event.get("detail", {})
            account_id = detail.get("recipientAccountId", "")
            service_details = detail.get("serviceEventDetails", {})
            request_details = service_details.get("eventRequestDetails", {})
            username = request_details.get("userName", "")

            if not username or ":" not in username:
                return

            role_part, email = username.split(":", 1)
            if role_part not in ROLE_SUBSCRIPTION_MAP:
                return

            target_role = ROLE_SUBSCRIPTION_MAP[role_part]
            qs_username = f"{role_part}/{email}"

            quick.update_user(
                AwsAccountId=account_id,
                Namespace="default",
                UserName=qs_username,
                Role=target_role,
                Email=email,
            )
      Events:
        QuickCreateUser:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.quicksight
              # "AWS Service Event via CloudTrail" never matches a real
              # quicksight.amazonaws.com CreateUser call — that's an
              # API call made by a principal (the federated user's first
              # SAML login), which CloudTrail/EventBridge classifies as
              # "AWS API Call via CloudTrail". With the wrong detail-type
              # this rule silently never fires and the subscription is
              # never auto-assigned. Verified against a real deployment:
              # switching to "AWS API Call via CloudTrail" is what
              # actually triggers this Lambda (confirmed via CloudWatch
              # Lambda invocation metrics on a running stack).
              detail-type:
                - AWS API Call via CloudTrail
              detail:
                eventSource:
                  - quicksight.amazonaws.com
                eventName:
                  - CreateUser

Outputs:
  Step10DNS:
    Description: "Configure DNS - Add CNAME record pointing your domain to this ALB DNS name"
    Value: !GetAtt LoadBalancer.DNSName

  Step20Admin:
    Description: "Configure Keycloak admin - Create a permanent admin account and delete the temporary one"
    Value: !Sub "https://${KeycloakDomain}"

  Step21KeycloakAdminSecret:
    Description: "Initial Keycloak admin password secret ARN"
    Value: !Ref KeycloakAdminSecret

  Step30Bootstrap:
    Description: "Configure Keycloak - use SSM Session Manager, edit /opt/keycloak/bootstrap/.env, then run bootstrap.sh"
    Value: !Sub "aws ssm start-session --target ${EC2Instance}"

  Step40SAMLProvider:
    Description: "Configure AWS IAM - Download SAML Metadata and create SAML Provider"
    Value: !Sub "https://${KeycloakDomain}/realms/quick/protocol/saml/descriptor"

  Step51IdPURL:
    Description: "Configure Quick SSO - IdP URL"
    Value: !Sub "https://${KeycloakDomain}/realms/quick/protocol/saml/clients/aws"

  Step52Redirect:
    Description: "Configure Quick SSO - IdP redirect URL parameter"
    Value: "RelayState"

  Step61IssuerURL:
    Description: "Configure Quick Desktop - Issuer URL"
    Value: !Sub "https://${KeycloakDomain}/realms/quick"

  Step62AuthEndpoint:
    Description: "Configure Quick Desktop - Authorization Endpoint"
    Value: !Sub "https://${KeycloakDomain}/realms/quick/protocol/openid-connect/auth"

  Step63TokenEndpoint:
    Description: "Configure Quick Desktop - Token Endpoint"
    Value: !Sub "https://${KeycloakDomain}/realms/quick/protocol/openid-connect/token"

  Step64JWKSURI:
    Description: "Configure Quick Desktop - JWKS URI"
    Value: !Sub "https://${KeycloakDomain}/realms/quick/protocol/openid-connect/certs"

  Step65ClientID:
    Description: "Configure Quick Desktop - Client ID"
    Value: "amazon-quick-desktop"
